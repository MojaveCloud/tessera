<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tessera · render farm</title>
<style>
  :root { --bg: #07070c; --ink: #e9e7f2; --dim: #7d7a92; --line: #1d1c2a; --hot: #ffb547; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  main { width: min(92vmin, 880px); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 14px; }
  h1 { font-size: 22px; letter-spacing: .02em; font-weight: 650; }
  h1 span { color: var(--dim); font-weight: 400; }
  #status { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); white-space: nowrap; }
  #status b { color: var(--hot); font-weight: 600; }
  .bar { display: flex; align-items: center; gap: 14px; }
  button { font: 600 13px ui-sans-serif, system-ui, sans-serif; color: #120c02; background: var(--hot); border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; }
  button:disabled { opacity: .45; cursor: default; }
  button[hidden] { display: none; }
  #grid { display: grid; gap: 2px; aspect-ratio: 1; background: var(--line); border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .cell { position: relative; background: #0d0c16; }
  .cell img { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transform: scale(1.04); transition: opacity .35s ease-out, transform .5s ease-out; }
  .cell.on img { opacity: 1; transform: none; }
  .cell.on::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 2px var(--hot); animation: flash .7s ease-out forwards; }
  @keyframes flash { to { box-shadow: inset 0 0 0 2px transparent; } }
  footer { margin-top: 12px; color: var(--dim); font-size: 13px; }
  code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Tessera <span>render farm</span></h1>
    <div class="bar">
      <div id="status">waiting for a render</div>
      <button id="render" hidden>Render</button>
    </div>
  </header>
  <div id="grid"></div>
  <footer>Seahorse Valley, 3840 × 3840. Each of the 64 tiles is rendered by its own job task, in its own microVM.</footer>
</main>
<script>
  const grid = document.getElementById("grid");
  const status = document.getElementById("status");
  const button = document.getElementById("render");
  let job = "", n = 0, count = 0, t0 = 0;

  // Before the first tile: what the render is waiting for.
  const waiting = {
    pending: "starting machines… (the first render takes about 2 minutes)",
    running: "rendering…",
    failed: "the render failed; see <code>mojave jobs list</code>",
    canceled: "the render was canceled",
  };
  function waitStatus(s) {
    if (s === "running" && !t0) t0 = performance.now();
    if (count === 0 && waiting[s]) status.innerHTML = waiting[s];
    button.disabled = s === "pending" || s === "running";
  }
  button.onclick = async () => {
    button.disabled = true;
    status.textContent = "starting…";
    const r = await fetch("/render", { method: "POST" });
    if (!r.ok) { status.textContent = await r.text(); button.disabled = false; }
  };

  function build(size) {
    n = size * size;
    grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
    grid.replaceChildren(...Array.from({ length: n }, () => {
      const c = document.createElement("div");
      c.className = "cell";
      return c;
    }));
  }
  // The clock starts when tasks start, so it times the render, not the machines booting.
  function reset(id) { job = id; count = 0; t0 = 0; [...grid.children].forEach(c => { c.className = "cell"; c.replaceChildren(); }); }
  function show(index) {
    const cell = grid.children[index];
    if (!cell || cell.classList.contains("on")) return;
    const img = new Image();
    img.onload = () => { cell.replaceChildren(img); requestAnimationFrame(() => cell.classList.add("on")); };
    img.src = `/tiles/${job}/${index}.png`;
    if (!t0) t0 = performance.now();
    count++;
    const secs = t0 ? ((performance.now() - t0) / 1000).toFixed(1) + " s" : "";
    status.innerHTML = count === n ? `<b>${n} / ${n}</b> tiles · done ${secs}` : `<b>${count} / ${n}</b> tiles ${secs}`;
  }

  fetch("/state").then(r => r.json()).then(s => {
    build(s.grid);
    button.hidden = !s.canRender;
    if (s.job) { job = s.job; s.done.forEach(show); waitStatus(s.status); }
    const es = new EventSource("/events");
    es.onmessage = (e) => {
      const ev = JSON.parse(e.data);
      if (ev.type === "job" || ev.job !== job) { reset(ev.job); waitStatus(ev.status ?? ""); }
      if (ev.type === "tile") show(ev.index);
      if (ev.type === "status") waitStatus(ev.status);
    };
  });
</script>
</body>
</html>
